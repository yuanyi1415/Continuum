name: Bootstrap Continuum v1.0 source

on:
  push:
    paths:
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify official source package
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/source.part.* | base64 -d > /tmp/continuum-v1.0.0.zip
          echo "547dd1f33bc79f25a9ccaa5ba8579381518cbefb35add8600343bf46e241c5b5  /tmp/continuum-v1.0.0.zip" | sha256sum -c -
          rm -rf /tmp/continuum-v1.0.0
          mkdir -p /tmp/continuum-v1.0.0
          unzip -q /tmp/continuum-v1.0.0.zip -d /tmp/continuum-v1.0.0

      - name: Materialize Continuum v1.0 repository
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude=.git /tmp/continuum-v1.0.0/ ./
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Commit official MVP v1.0.0 baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && {
            echo "Nothing to commit."
            exit 0
          }
          git commit -m "release: Continuum MVP v1.0.0"
          git push origin HEAD:main
